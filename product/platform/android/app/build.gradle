plugins {
    id 'com.android.application' version '9.3.2'
}

if (providers.gradleProperty('consensusBuild').isPresent()) {
    layout.buildDirectory.set(layout.projectDirectory.dir('build-pointer-consensus'))
} else if (providers.gradleProperty('preciseBuild').isPresent()) {
    layout.buildDirectory.set(layout.projectDirectory.dir('build-precise-pointer'))
} else if (providers.gradleProperty('stableBuild').isPresent()) {
    layout.buildDirectory.set(layout.projectDirectory.dir('build-stable-pointer'))
} else if (providers.gradleProperty('edgesBuild').isPresent()) {
    layout.buildDirectory.set(layout.projectDirectory.dir('build-edges'))
} else if (providers.gradleProperty('winkBuild').isPresent()) {
    layout.buildDirectory.set(layout.projectDirectory.dir('build-wink'))
} else if (providers.gradleProperty('performanceBuild').isPresent()) {
    layout.buildDirectory.set(layout.projectDirectory.dir('build-performance'))
} else if (providers.gradleProperty('trackingBuild').isPresent()) {
    layout.buildDirectory.set(layout.projectDirectory.dir('build-tracking'))
} else if (providers.gradleProperty('neutralBuild').isPresent()) {
    layout.buildDirectory.set(layout.projectDirectory.dir('build-neutral'))
} else if (providers.gradleProperty('responsiveBuild').isPresent()) {
    layout.buildDirectory.set(layout.projectDirectory.dir('build-responsive'))
} else if (providers.gradleProperty('globalBuild').isPresent()) {
    layout.buildDirectory.set(layout.projectDirectory.dir('build-global'))
} else if (providers.gradleProperty('portraitBuild').isPresent()) {
    layout.buildDirectory.set(layout.projectDirectory.dir('build-portrait'))
}

def root = rootProject.file('../../..')
def tracker = new File(root, 'product/training/head_control_tracker/v2')
def graph = new File(tracker, 'calibration_runtime/tracker_d.onnx')
def normalizer = new File(tracker, 'experiments/preliminary_20261126T044504Z_db2cc8bd/D_mlp_9_normalizador.json')
def face = new File(root, 'v2/assets/face_landmarker.task')
def staged = layout.buildDirectory.dir('generated/trackerAssets')
def stageTrackerAssets = tasks.register('stageTrackerAssets', Sync) {
    inputs.files(graph, normalizer, face)
    from(graph)
    from(normalizer) { rename { 'normalizer.json' } }
    from(face)
    into(staged)
    doFirst {
        def hashes = [
            (graph): 'f621ee5ad026eaf155d8e7df37b024fa6c1df893f534cf4cde9ef3dab95ab084',
            (normalizer): 'de3bcfd0589b96cf5ca144e941db1e93193cb3eac6ed677b087a0f985d9956ed',
            (face): '64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff'
        ]
        hashes.each { path, expected ->
            if (java.security.MessageDigest.getInstance('SHA-256').digest(path.bytes).encodeHex().toString() != expected) {
                throw new GradleException("Huella incompatible: " + path.name)
            }
        }
    }
}

android {
    namespace 'org.headcontrol.tracker'
    compileSdk 37
    defaultConfig {
        applicationId 'org.headcontrol.tracker'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '0.5.0-demo'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets.main.assets.srcDir(staged.get().asFile)
    androidResources { noCompress += ['task', 'onnx'] }
}

tasks.named('preBuild') { dependsOn(stageTrackerAssets) }

dependencies {
    implementation 'com.google.mediapipe:tasks-vision:0.10.32'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.26.0'
    implementation 'org.opencv:opencv:4.12.0'
}
